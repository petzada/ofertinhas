[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ofertinhas"
version = "0.1.0"
description = "Ranqueia e dispara ofertas de afiliado do Mercado Livre em grupos de Telegram e WhatsApp."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21",
    "httpx>=0.27",
    "pillow>=10",
    "qrcode>=7.4",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pyzbar>=0.1.9",
    "freezegun>=1.5",
    "ruff>=0.6",
    "pytest-testmon>=2.2",
    "lefthook>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
