name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Push novo no mesmo PR cancela o run anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Repositório público (minutos de Actions gratuitos): os três jobs rodam em paralelo em todo
# evento, inclusive em PR draft. Local fica só o pre-commit (ruff nos arquivos em stage).
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 é a do .venv e a mínima do Worker (cloud/worker/pyproject.toml); 3.12 é a
        # mínima do pacote.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # libzbar0 (pyzbar, testes de QR) com cache: evita apt-get update em todo run
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libzbar0
          version: 1
      - run: sudo ldconfig
      - run: pip install -e ".[dev]"
      # inclui tests/cloud/test_bundle.py: monta o bundle do Worker e o importa sem as
      # dependências que só existem no PC
      - run: pytest

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test "extension/tests/**/*.test.js"
