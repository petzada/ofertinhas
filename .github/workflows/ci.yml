name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: tirar o PR de draft dispara as etapas pesadas.
    types: [opened, synchronize, reopened, ready_for_review]

# Push novo no mesmo PR cancela o run anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Repositório privado: em PR draft só o lint roda; matriz de testes e extensão rodam
# quando o PR fica pronto (ou em push na main). Os gates locais (lefthook) cobrem o diff.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 é a do .venv e a mínima do Worker (cloud/worker/pyproject.toml); 3.12 é a
        # mínima do pacote.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: pip install -e ".[dev]"
      # inclui tests/cloud/test_bundle.py: monta o bundle do Worker e o importa sem as
      # dependências que só existem no PC
      - run: pytest

  extension:
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test "extension/tests/**/*.test.js"
