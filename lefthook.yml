# Gates locais leves: pre-commit só nos arquivos em stage (< 10 s). Sem pre-push: os testes
# afetados rodam antes de abrir o PR (`python scripts/test_related.py`) e a suíte completa,
# a matriz de Python e o bundle do Worker ficam no CI.
# Instalação (uma vez): .venv/Scripts/python -m pip install -e ".[dev]" && .venv/Scripts/lefthook install
# Os comandos usam o Python do .venv quando existe (dev no Windows) e o do PATH no resto.

pre-commit:
  parallel: true
  jobs:
    # Um job só, em série: `ruff check --fix` e `ruff format` gravam nos mesmos arquivos.
    - name: ruff
      glob: "*.py"
      run: >-
        PY=$( [ -x .venv/Scripts/python.exe ] && echo .venv/Scripts/python.exe || echo python )
        && $PY -m ruff check --fix {staged_files}
        && $PY -m ruff format {staged_files}
      stage_fixed: true
