# Copie para config.yaml e ajuste. Cada nicho herda de `defaults` e só declara o que muda.
# Categorias: só as 24 raiz do portal de afiliados (lista em src/ofertinhas/collector/categories.py)

multi_niche: false  # true: a oferta vai para todos os nichos que casar, não só o de maior nota
whatsapp_enabled: false  # trava: nada vai para o WhatsApp enquanto estiver false
x_enabled: false  # trava do X: com true, cada post do Telegram também sai no X, em thread
brand: "Ofertas 2KAI"    # texto do topo do card (o mesmo para todos os nichos)

collector:              # ritmo da extensão no portal de afiliados
  every_min: 60         # um ciclo de coleta a cada ~60 min
  jitter_min: 10        # ± variação aleatória
  pages_per_category: 1 # 18 ofertas por página (as melhores da categoria ficam na 1ª)
  categories_per_cycle: 6  # rodízio: cada ciclo coleta 6 categorias, as próximas no ciclo seguinte
                           # (os search_terms dos nichos entram no mesmo rodízio e contam aqui)
  request_gap_s: [5, 15]
  include_unfiltered: false  # true: também lê a lista geral (nicho só por keywords)
  window: ["05:30", "22:00"]  # coleta e links só nesse horário ("Coletar agora" vale sempre)
  max_links_per_hour: 30
  link_gap_s: [30, 90]
  stock_hours: 6        # estoque-alvo: link só quando o pronto não cobre as próximas 6 h de posts
  stock_extra: 2        # folga além do alvo

defaults:
  weights:               # importância relativa de cada critério (a soma é normalizada para 100)
    commission_pct: 35   # % de comissão do afiliado
    discount_pct: 25     # % OFF (de/por)
    commission_brl: 15   # R$ estimado por venda
    rating: 10           # estrelas
    sold_count: 10       # vendidos (escala log)
    freshness: 5         # oferta vista pela primeira vez há pouco tempo
    free_shipping: 0     # frete grátis: desligado, o portal não informa
    full: 0              # Mercado Envios Full: desligado, o portal não informa
  targets:               # valor que vale nota máxima no critério
    commission_pct: 20
    discount_pct: 60
    commission_brl: 40
    sold_count: 5000
    rating_floor: 4.0    # avaliação igual ou abaixo vale 0; 5.0 vale o máximo
    freshness_hours: 24  # depois disso a frescor vale 0
  filters:
    min_price: 15
    max_price: 3000
    min_rating: 4.0      # ofertas sem avaliação passam
    require_free_shipping: false
    require_full: false
    blocked_keywords: [usado, recondicionado, réplica, seminovo]
    # required_keywords: [jogo de cama, panela*]  # nicho fino: o título precisa ter um destes
  price_check:           # desconto inflado, conferido no histórico de preços da coleta
    enabled: true
    lookback_days: 30    # se o preço já foi menor nesse período, a "promoção" vale 0% de desconto
    tolerance_pct: 5     # e se o "de" subiu, o desconto é contado sobre o "de" antigo
  rules:                 # decide pela oferta; a nota só ordena quem pega a cota do dia
    # mais de 39% de desconto E mais de 19% de comissão: link automático
    auto: {min_discount_pct: 39, min_commission_pct: 19, strict: true}
    # 30% de desconto E 15% de comissão pra cima: card para você aprovar; o resto é descartado
    review: {min_discount_pct: 30, min_commission_pct: 15}
  auto_approve_at: 80    # cortes por nota: só valem se `rules` for removido
  manual_review_at: 65
  max_auto_per_day: 10   # cota do dia por nicho: as melhores primeiro; o resto concorre amanhã
  max_review_per_day: 8  # no máximo 8 cards de aprovação por nicho por dia
  repost_cooldown_days: 7
  repost_price_drop_pct: 10  # dentro do cooldown, só reposta se o preço cair isso
  max_offer_age_hours: 6     # oferta que não reaparece na coleta nesse tempo não é postada
  pacing:                    # Telegram: a melhor oferta pronta a cada 30 a 60 min
    min_interval_min: 45
    jitter_min: 15                  # 45 ± 15 min, sorteado a cada post
    window: ["06:00", "22:00"]  # com aspas: sem elas o YAML lê 22:00 como número
    max_posts_per_day: 32
    whatsapp_between_groups_s: [30, 90]
  whatsapp_pacing:           # WhatsApp: a melhor oferta do período a cada 60 a 90 min
    min_interval_min: 75
    jitter_min: 15                  # 75 ± 15 min
    window: ["08:00", "18:00"]
    max_posts_per_day: 10

niches:
  casa:
    # Casa e Decoração; Eletrodomésticos; Ferramentas; Construção
    categories: [MLB1574, MLB5726, MLB263532, MLB1500]
